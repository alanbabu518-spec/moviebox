<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="MovieBox" />
    <meta property="og:description" content="Find what to watch next." />
    <meta property="og:image" content="https://movie-box-gilt-seven.vercel.app//og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>MovieBox</title>

    <script>
      (() => {
        const theme = localStorage.getItem("moviebox-theme");
        document.documentElement.setAttribute(
          "data-theme",
          theme === "light" || theme === "dark" ? theme : "dark",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
