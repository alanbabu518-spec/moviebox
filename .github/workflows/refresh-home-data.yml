
name: Refresh MovieBox Homepage Data

on:
  schedule:
    # Every day at 07:30 AM IST (02:00 UTC)
    - cron: "0 2 * * *"

  # Allow manual execution from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate homepage data
        working-directory: client
        env:
          VITE_API_BASE_URL: https://moviebox-bm0l.onrender.com/api
        run: node scripts/generate-home-data.mjs

      - name: Commit updated homepage data
        run: |
          if git diff --quiet -- client/public/data/home.json; then
            echo "Homepage data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add client/public/data/home.json
          git commit -m "chore: refresh homepage movie data"
          git push
